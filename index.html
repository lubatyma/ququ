<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>과일 짝맞추기 게임</title>
<style>
  body { text-align:center; font-family:sans-serif; }
  h1 { margin-top:20px; }
  .grid {
    display:grid;
    grid-template-columns: repeat(4, 80px);
    gap:10px;
    justify-content:center;
    margin-top:20px;
  }
  .card {
    width:80px;
    height:80px;
    font-size:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#4CAF50;
    color:white;
    cursor:pointer;
    border-radius:10px;
  }
  .flipped {
    background:#fff;
    color:black;
    cursor:default;
  }
</style>
</head>
<body>
<h1>🍓 과일 짝맞추기 게임</h1>
<div class="grid" id="grid"></div>
<p id="status"></p>

<script>
const fruits = ['🍎','🍌','🍇','🍊','🍓','🍍','🥝','🍉'];
let cards = [...fruits, ...fruits];
cards.sort(() => Math.random() - 0.5);

const grid = document.getElementById('grid');
let first = null;
let second = null;
let lock = false;
let matched = 0;

cards.forEach((fruit, index) => {
  const div = document.createElement('div');
  div.classList.add('card');
  div.dataset.fruit = fruit;
  div.dataset.index = index;
  div.innerText = '?';

  div.addEventListener('click', () => {
    if(lock || div.classList.contains('flipped')) return;

    div.classList.add('flipped');
    div.innerText = fruit;

    if(!first) {
      first = div;
    } else {
      second = div;
      lock = true;

      if(first.dataset.fruit === second.dataset.fruit) {
        matched += 2;
        resetTurn();

        if(matched === cards.length) {
          document.getElementById('status').innerText = '🎉 모두 맞췄어요!';
        }
      } else {
        setTimeout(() => {
          first.classList.remove('flipped');
          second.classList.remove('flipped');
          first.innerText = '?';
          second.innerText = '?';
          resetTurn();
        }, 800);
      }
    }
  });

  grid.appendChild(div);
});

function resetTurn() {
  first = null;
  second = null;
  lock = false;
}
</script>
</body>
</html>
